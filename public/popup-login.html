<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login To Hive</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --accent: #0284c7;
            --border: #dbe5ef;
            --danger: #b91c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at 10% 10%, #e0f2fe 0%, var(--bg) 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.5rem;
        }

        p.sub {
            margin: 0 0 18px;
            color: var(--muted);
        }

        label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            margin: 12px 0 6px;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.96rem;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button.primary {
            background: var(--accent);
            color: white;
            flex: 1;
        }

        button.secondary {
            background: #334155;
            color: white;
        }

        .status {
            margin-top: 12px;
            color: var(--muted);
            min-height: 20px;
        }

        .status.error {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Hive Login</h1>
        <p class="sub">Sign in to access global documentation.</p>

        <form id="loginForm">
            <label for="userId">User ID / Email</label>
            <input id="userId" name="userId" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <div class="actions">
                <button type="submit" class="primary" id="loginBtn">Login</button>
                <button type="button" class="secondary" id="cancelBtn">Cancel</button>
            </div>
        </form>

        <div id="status" class="status"></div>
    </main>

    <script type="module">
        import { getDeviceId, initClient } from "/hive-client.js";

        const form = document.getElementById("loginForm");
        const status = document.getElementById("status");
        const loginBtn = document.getElementById("loginBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        initClient({}).catch(() => {});

        cancelBtn.addEventListener("click", () => {
            window.close();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const userId = String(document.getElementById("userId").value || "").trim();
            const password = String(document.getElementById("password").value || "");

            if (!userId || !password)
            {
                status.textContent = "Enter valid credentials.";
                status.classList.add("error");
                return;
            }

            loginBtn.disabled = true;
            status.classList.remove("error");
            status.textContent = "Signing in...";

            try
            {
                const deviceId = await getDeviceId();
                const response = await fetch("/Login", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json",
                        "x-device-id": deviceId
                    },
                    body: JSON.stringify({
                        userId,
                        username: userId,
                        password
                    })
                });

                const sessionToken = response.headers.get("x-session-token") || "";

                if (!response.ok)
                {
                    status.textContent = "Invalid login credentials.";
                    status.classList.add("error");
                    window.alert("Invalid login credentials.");

                    if (window.opener && !window.opener.closed)
                    {
                        window.opener.postMessage({
                            type: "hive-login-failed",
                            message: "Invalid login credentials."
                        }, window.location.origin);
                    }

                    loginBtn.disabled = false;
                    return;
                }

                if (sessionToken)
                {
                    localStorage.setItem("sessionToken", sessionToken);
                }

                if (window.opener && !window.opener.closed)
                {
                    window.opener.postMessage({
                        type: "hive-login-success",
                        sessionToken
                    }, window.location.origin);
                }

                status.textContent = "Login successful. Returning...";
                window.close();
            }
            catch (error)
            {
                status.textContent = "Login failed due to a network error.";
                status.classList.add("error");
                window.alert("Unable to complete login. Please try again.");
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
