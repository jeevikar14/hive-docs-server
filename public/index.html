<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hive Global Documentation</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --accent: #0ea5e9;
            --accent-dark: #0284c7;
            --border: #dbe5ef;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(180deg, #f0f7ff 0%, var(--bg) 60%);
            color: var(--text);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .sub {
            color: var(--muted);
            margin-top: 10px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            margin-top: 24px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .row:last-child {
            border-bottom: none;
        }

        .name {
            font-weight: 600;
        }

        .muted {
            color: var(--muted);
            font-size: 0.92rem;
        }

        a.button,
        button.button {
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            padding: 9px 13px;
            font-weight: 600;
            display: inline-block;
            border: 0;
            cursor: pointer;
            transition: transform 120ms ease, opacity 120ms ease;
        }

        a.button:hover,
        button.button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 24px;
        }

        .status {
            color: var(--muted);
            margin-top: 8px;
            font-size: 0.92rem;
        }

        .versions {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 3px 9px;
            border-radius: 999px;
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            color: #075985;
            font-size: 0.78rem;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .button.secondary {
            background: #334155;
        }

        .button.secondary:hover {
            background: #1e293b;
        }

        .auth-hint {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Hive Global Docs</h1>
        <p class="sub">Published API documentation for all services and versions.</p>

        <section class="card">
            <h2>Services</h2>
            <div class="buttons" style="margin-bottom: 10px;">
                <button class="button secondary" id="logoutBtn" style="display:none; border:0; cursor:pointer;">Logout</button>
            </div>
            <div id="status" class="status">Fetching latest published services...</div>
            <div id="services" class="empty">Loading services...</div>
        </section>
    </main>

    <script>
        let publicConfig = {
            docsViewPermission: "DOCS_VIEW",
            hiveLoginUrl: `${window.location.protocol}//${window.location.hostname}:49152/Client/Pages/HivePortalLoginPage.html`
        };
        let unauthorizedAlertShown = false;

        function showUnauthorizedAlert()
        {
            if (unauthorizedAlertShown)
            {
                return;
            }

            unauthorizedAlertShown = true;
            window.alert("Not authorized to view docs. Contact AMTG admin.");
        }

        async function loadPublicConfig()
        {
            try
            {
                const response = await fetch("/api/public-config");
                if (!response.ok) return;
                const payload = await response.json();
                publicConfig = { ...publicConfig, ...payload };
            }
            catch (error)
            {
            }
        }

        async function buildHiveAuthHeaders()
        {
            const headers = {};

            try
            {
                const sdk = await import("/hive-client.js");
                const deviceId = await sdk.getDeviceId();

                if (deviceId)
                {
                    headers["x-device-id"] = deviceId;
                    document.cookie = `hiveDeviceId=${encodeURIComponent(deviceId)}; path=/; SameSite=Lax`;
                }
            }
            catch (error)
            {
            }

            const sessionToken = localStorage.getItem("sessionToken");
            if (sessionToken)
            {
                headers["x-session-token"] = sessionToken;
                document.cookie = `hiveSessionToken=${encodeURIComponent(sessionToken)}; path=/; SameSite=Lax`;
            }

            return headers;
        }

        async function hiveFetch(url, options = {})
        {
            const authHeaders = await buildHiveAuthHeaders();
            const existingHeaders = options.headers || {};

            return fetch(url, {
                ...options,
                credentials: "include",
                headers: {
                    ...existingHeaders,
                    ...authHeaders
                }
            });
        }

        async function initializeHiveClientContext()
        {
            try
            {
                const sdk = await import("/hive-client.js");
                await sdk.initClient({});

                const deviceId = await sdk.getDeviceId();
                if (deviceId)
                {
                    document.cookie = `hiveDeviceId=${encodeURIComponent(deviceId)}; path=/; SameSite=Lax`;
                }
            }
            catch (error)
            {
            }
        }

        async function logoutHiveSession()
        {
            const status = document.getElementById("status");

            try
            {
                status.textContent = "Logging out...";
                await hiveFetch("/Logout", { method: "POST" });
            }
            catch (error)
            {
            }

            localStorage.removeItem("sessionToken");
            document.cookie = "sessionToken=; Max-Age=0; path=/";
            document.cookie = "hiveSessionToken=; Max-Age=0; path=/";

            window.location.reload();
        }

        function openHiveLoginPopup(returnUrl)
        {
            const status = document.getElementById("status");
            const popup = window.open(
                "/popup-login.html",
                "Hive Login",
                "width=520,height=620"
            );

            if (!popup)
            {
                status.textContent = "Popup blocked. Allow popups and click Login again.";
                return;
            }

            status.textContent = "Complete login in popup. Checking session...";

            const onPopupMessage = async (event) =>
            {
                if (event.origin !== window.location.origin)
                {
                    return;
                }

                const message = event.data || {};

                if (message.type === "hive-login-failed")
                {
                    status.textContent = message.message || "Invalid login credentials.";
                    return;
                }

                if (message.type !== "hive-login-success")
                {
                    return;
                }

                if (message.sessionToken)
                {
                    localStorage.setItem("sessionToken", message.sessionToken);
                }

                window.removeEventListener("message", onPopupMessage);

                try
                {
                    const authResponse = await hiveFetch("/api/auth/status");
                    const auth = await authResponse.json();

                    if (auth.loggedIn && auth.canViewDocs)
                    {
                        if (returnUrl)
                        {
                            window.location.href = returnUrl;
                        }
                        else
                        {
                            window.location.reload();
                        }
                        return;
                    }

                    if (auth.loggedIn && !auth.canViewDocs)
                    {
                        status.textContent = "Not authorized to view docs. Contact AMTG admin.";
                        showUnauthorizedAlert();
                        loadServices();
                        return;
                    }
                }
                catch (error)
                {
                }

                loadServices();
            };

            window.addEventListener("message", onPopupMessage);

            let checks = 0;
            const maxChecks = 60;
            const timer = setInterval(async () => {
                checks += 1;

                if (popup.closed)
                {
                    clearInterval(timer);
                    window.removeEventListener("message", onPopupMessage);
                    status.textContent = "Popup closed. Checking login status...";
                    loadServices();
                    return;
                }

                if (checks >= maxChecks)
                {
                    clearInterval(timer);
                    status.textContent = "Login not detected yet. If popup login is complete, click Login to Hive again.";
                }
            }, 1200);
        }

        async function requestDocsViewPermission()
        {
            const status = document.getElementById("status");
            const response = await hiveFetch("/api/permissions/request", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    permissionName: publicConfig.docsViewPermission,
                    reason: "Need to view API documentation."
                })
            });

            const payload = await response.json();
            status.textContent = payload.message || "Permission request submitted.";
        }

        async function loadServices()
        {
            const container = document.getElementById("services");
            const status = document.getElementById("status");
            const logoutBtn = document.getElementById("logoutBtn");

            try
            {
                const authResponse = await hiveFetch("/api/auth/status");
                const auth = authResponse.ok ? await authResponse.json() : { loggedIn: false, canViewDocs: false };

                if (logoutBtn)
                {
                    logoutBtn.style.display = auth.loggedIn ? "inline-block" : "none";
                }

                if (!auth.loggedIn)
                {
                    status.innerHTML = "Login required to view services.";
                    container.className = "empty";
                    container.innerHTML = `
                        <p>Stay on this page and login through popup.</p>
                        <div class="buttons" style="justify-content:center;">
                            <button class="button" id="loginBtn">Login to Hive</button>
                        </div>
                    `;

                    const loginBtn = document.getElementById("loginBtn");
                    if (loginBtn)
                    {
                        loginBtn.addEventListener("click", () => {
                            status.textContent = "Waiting for login popup...";
                            openHiveLoginPopup(window.location.href);
                        });
                    }

                    return;
                }

                if (!auth.canViewDocs)
                {
                    status.textContent = "Not authorized to view docs. Contact AMTG admin.";
                    container.className = "empty";
                    container.innerHTML = `
                        <p>Not authorized to view this documentation.</p>
                        <div class="buttons" style="justify-content:center; margin-top:10px;">
                            <button class="button" id="requestAccessBtn">Request Access</button>
                        </div>
                    `;

                    const requestAccessBtn = document.getElementById("requestAccessBtn");
                    if (requestAccessBtn)
                    {
                        requestAccessBtn.addEventListener("click", () => {
                            requestDocsViewPermission().catch(() => {
                                status.textContent = "Failed to submit permission request.";
                            });
                        });
                    }

                    showUnauthorizedAlert();
                    return;
                }

                const response = await hiveFetch("/api/services");

                if (!response.ok)
                {
                    throw new Error("Unable to fetch services.");
                }

                const payload = await response.json();
                const services = payload.services || [];

                if (services.length === 0)
                {
                    status.textContent = "No published services yet.";
                    container.className = "empty";
                    container.textContent = "No documentation has been published yet.";
                    return;
                }

                status.textContent = `${services.length} service(s) available`;
                container.className = "";
                container.innerHTML = services.map((service) => {
                    const latest = service.latestVersion || "-";
                    const versionCount = Array.isArray(service.versions) ? service.versions.length : 0;
                    const latestTime = service.latestPublishedAt
                        ? new Date(service.latestPublishedAt).toLocaleString()
                        : "Unknown";
                    const versions = Array.isArray(service.versions) ? service.versions : [];
                    const versionChips = versions.map((version) => `<span class="chip">${version}</span>`).join("");

                    return `
                        <div class="row">
                            <div>
                                <div class="name">${service.service}</div>
                                <div class="muted">Latest: ${latest} | Versions: ${versionCount}</div>
                                <div class="muted">Last published: ${latestTime}</div>
                                <div class="versions">${versionChips}</div>
                            </div>
                            <div class="buttons">
                                <a class="button" href="/docs/${service.service}" target="_blank" rel="noopener">Open Latest</a>
                                <a class="button secondary" href="/api/services/${service.service}/versions" target="_blank" rel="noopener">View All Versions</a>
                            </div>
                        </div>
                    `;
                }).join("");
            }
            catch (error)
            {
                status.textContent = "Unable to load services right now.";
                container.className = "empty";
                container.textContent = "Failed to load services.";
            }
        }

        initializeHiveClientContext()
            .then(loadPublicConfig)
            .then(loadServices);

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn)
        {
            logoutBtn.addEventListener("click", () => {
                logoutHiveSession();
            });
        }

        window.addEventListener("focus", () => {
            loadServices();
        });
    </script>
</body>
</html>
