<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hive Global Documentation</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --accent: #0ea5e9;
            --accent-dark: #0284c7;
            --border: #dbe5ef;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(180deg, #f0f7ff 0%, var(--bg) 60%);
            color: var(--text);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .sub {
            color: var(--muted);
            margin-top: 10px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            margin-top: 24px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .row:last-child {
            border-bottom: none;
        }

        .name {
            font-weight: 600;
        }

        .muted {
            color: var(--muted);
            font-size: 0.92rem;
        }

        a.button,
        button.button {
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            padding: 9px 13px;
            font-weight: 600;
            display: inline-block;
            border: 0;
            cursor: pointer;
            transition: transform 120ms ease, opacity 120ms ease;
        }

        a.button:hover,
        button.button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 24px;
        }

        .status {
            color: var(--muted);
            margin-top: 8px;
            font-size: 0.92rem;
        }

        .versions {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 3px 9px;
            border-radius: 999px;
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            color: #075985;
            font-size: 0.78rem;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .button.secondary {
            background: #334155;
        }

        .button.secondary:hover {
            background: #1e293b;
        }

        .auth-hint {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Hive Global Docs</h1>
        <p class="sub">Published API documentation for all services.</p>

        <section class="card">
            <h2>Services</h2>
            <div class="buttons" style="margin-bottom: 10px;">
                <button class="button secondary" id="logoutBtn" style="display:none; border:0; cursor:pointer;">Logout</button>
            </div>
            <div id="status" class="status">Fetching latest published services...</div>
            <div id="services" class="empty">Loading services...</div>
        </section>
    </main>

    <script>
        const ClientPaths = Object.freeze({
            PublicConfig: "/PublicConfig",
            HiveClientModule: "/hive-client.js",
            Logout: "/Logout",
            AuthStatus: "/AuthStatus",
            Services: "/Services",
            RequestPermission: "/RequestPermission",
            DocumentationRoot: "/Docs",
            ServiceVersions: "/ServiceVersions/:service",
            LoginPage: "/Login.html"
        });

        const DefaultPublicConfiguration = {
            documentationViewPermission: "",
            documentationPublishPermission: "",
            hiveLoginUrl: "",
            routePaths: {},
            loginPopupWidth: 520,
            loginPopupHeight: 620,
            loginStatusMaxChecks: 60,
            loginStatusCheckIntervalMs: 1200
        };

        let publicConfiguration = { ...DefaultPublicConfiguration };
        let hasShownUnauthorizedAlert = false;

        function showUnauthorizedAlert()
        {
            if (hasShownUnauthorizedAlert)
            {
                return;
            }

            hasShownUnauthorizedAlert = true;
            window.alert("Not authorized to view docs. Contact AMTG admin.");
        }

        async function loadPublicConfig()
        {
            try
            {
                const response = await fetch(ClientPaths.PublicConfig);
                if (!response.ok) return;
                const payload = await response.json();
                publicConfiguration = { ...publicConfiguration, ...payload };
            }
            catch (error)
            {
            }
        }

        async function buildHiveAuthenticationHeaders()
        {
            const headers = {};

            try
            {
                const sdk = await import(ClientPaths.HiveClientModule);
                const deviceId = await sdk.getDeviceId();

                if (deviceId)
                {
                    headers["x-device-id"] = deviceId;
                    document.cookie = `hiveDeviceId=${encodeURIComponent(deviceId)}; path=/; SameSite=Lax`;
                }
            }
            catch (error)
            {
            }

            const sessionToken = localStorage.getItem("sessionToken");
            if (sessionToken)
            {
                headers["x-session-token"] = sessionToken;
                document.cookie = `hiveSessionToken=${encodeURIComponent(sessionToken)}; path=/; SameSite=Lax`;
            }

            return headers;
        }

        async function hiveFetch(url, options = {})
        {
            const authenticationHeaders = await buildHiveAuthenticationHeaders();
            const existingHeaders = options.headers || {};

            return fetch(url, {
                ...options,
                credentials: "include",
                headers: {
                    ...existingHeaders,
                    ...authenticationHeaders
                }
            });
        }

        async function initializeHiveClientContext()
        {
            try
            {
                const sdk = await import(ClientPaths.HiveClientModule);
                await sdk.initClient({});

                const deviceId = await sdk.getDeviceId();
                if (deviceId)
                {
                    document.cookie = `hiveDeviceId=${encodeURIComponent(deviceId)}; path=/; SameSite=Lax`;
                }
            }
            catch (error)
            {
            }
        }

        async function logoutHiveSession()
        {
            const status = document.getElementById("status");

            try
            {
                status.textContent = "Logging out...";
                await hiveFetch(publicConfiguration.routePaths.Logout || ClientPaths.Logout, { method: "POST" });
            }
            catch (error)
            {
            }

            localStorage.removeItem("sessionToken");
            document.cookie = "sessionToken=; Max-Age=0; path=/";
            document.cookie = "hiveSessionToken=; Max-Age=0; path=/";

            window.location.reload();
        }

        async function openHiveLoginPopup()
        {
            const status = document.getElementById("status");

            try {
                status.textContent = "Opening Hive portal...";
                const sdk = await import(ClientPaths.HiveClientModule);
                await sdk.login();

                status.textContent = "Portal opened. Waiting for login...";

                // Poll /AuthStatus until login is detected or we hit max checks
                (async function pollAuthStatus() {
                    const pollInterval = Number(publicConfiguration.loginStatusCheckIntervalMs || 1200);
                    const maxPolls = Number(publicConfiguration.loginStatusMaxChecks || 60);

                    for (let attempt = 0; attempt < maxPolls; attempt++) {
                        try {
                            const authResponse = await hiveFetch(publicConfiguration.routePaths.AuthStatus || ClientPaths.AuthStatus);
                            if (authResponse && authResponse.ok) {
                                const auth = await authResponse.json();
                                if (auth.loggedIn) {
                                    status.textContent = "Login detected. Loading services...";
                                    await loadServices();
                                    return;
                                }
                            }
                        }
                        catch (e) {
                            // ignore and retry
                        }

                        await new Promise((r) => setTimeout(r, pollInterval));
                    }

                    status.textContent = "Login not detected yet. If portal login is complete, try again.";
                })();
            }
            catch (err) {
                status.textContent = "Failed to open Hive portal (popup blocked?).";
            }
        }

        async function requestDocumentationViewPermission()
        {
            const status = document.getElementById("status");
            const response = await hiveFetch(publicConfiguration.routePaths.RequestPermission || ClientPaths.RequestPermission, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    permissionName: publicConfiguration.documentationViewPermission,
                    reason: "Need to view API documentation."
                })
            });

            const payload = await response.json();
            status.textContent = payload.message || "Permission request submitted.";
        }

        async function loadServices()
        {
            const container = document.getElementById("services");
            const status = document.getElementById("status");
            const logoutButton = document.getElementById("logoutBtn");

            try
            {
                const authenticationResponse = await hiveFetch(publicConfiguration.routePaths.AuthStatus || ClientPaths.AuthStatus);
                const authentication = authenticationResponse.ok
                    ? await authenticationResponse.json()
                    : { loggedIn: false, canViewDocumentation: false };

                if (logoutButton)
                {
                    logoutButton.style.display = authentication.loggedIn ? "inline-block" : "none";
                }

                if (!authentication.loggedIn)
                {
                    status.innerHTML = "Login required to view services.";
                    container.className = "empty";
                    container.innerHTML = `
                        <p>Stay on this page and login through popup.</p>
                        <div class="buttons" style="justify-content:center;">
                            <button class="button" id="loginBtn">Login to Hive</button>
                        </div>
                    `;

                    const loginBtn = document.getElementById("loginBtn");
                    if (loginBtn)
                    {
                        loginBtn.addEventListener("click", () => {
                            status.textContent = "Waiting for login popup...";
                            openHiveLoginPopup();
                        });
                    }

                    return;
                }

                if (!authentication.canViewDocumentation)
                {
                    status.textContent = "Not authorized to view docs. Contact AMTG admin.";
                    container.className = "empty";
                    container.innerHTML = `
                        <p>Not authorized to view this documentation.</p>
                        <div class="buttons" style="justify-content:center; margin-top:10px;">
                            <button class="button" id="requestAccessBtn">Request Access</button>
                        </div>
                    `;

                    const requestAccessBtn = document.getElementById("requestAccessBtn");
                    if (requestAccessBtn)
                    {
                        requestAccessBtn.addEventListener("click", () => {
                            requestDocumentationViewPermission().catch(() => {
                                status.textContent = "Failed to submit permission request.";
                            });
                        });
                    }

                    showUnauthorizedAlert();
                    return;
                }

                const response = await hiveFetch(publicConfiguration.routePaths.Services || ClientPaths.Services);

                if (!response.ok)
                {
                    throw new Error("Unable to fetch services.");
                }

                const payload = await response.json();
                let services = payload.services || [];
                // Always show NoteHive if no services are returned
                if (services.length === 0) {
                    services = [{ service: "notehive", latestPublishedAt: "", versions: [] }];
                }

                status.textContent = `${services.length} service(s) available`;
                container.className = "";
                container.innerHTML = services.map((service) => {
                    const publishedAt = service.publishedAt || service.latestPublishedAt || null;
                    const publishedTime = publishedAt ? new Date(publishedAt).toLocaleString() : "Not published";
                    // Link to the protected documentation route so the server can enforce auth
                    const docUrl = `${publicConfiguration.routePaths.DocumentationRoot || ClientPaths.DocumentationRoot}/${service.service}`;
                    return `
                            <div class="row">
                                <div>
                                    <div class="name">${service.service}</div>
                                    <div class="muted">Last published: ${publishedTime}</div>
                                </div>
                                <div class="buttons">
                                    <a class="button" href="${docUrl}" target="_blank" rel="noopener">Open Documentation</a>
                                </div>
                            </div>
                        `;
                }).join("");
            }
            catch (error)
            {
                status.textContent = "Unable to load services right now.";
                container.className = "empty";
                container.textContent = "Failed to load services.";
            }
        }

        initializeHiveClientContext()
            .then(loadPublicConfig)
            .then(loadServices);

        const logoutButton = document.getElementById("logoutBtn");
        if (logoutButton)
        {
            logoutButton.addEventListener("click", () => {
                logoutHiveSession();
            });
        }

        // Handle messages from the login popup
        window.addEventListener('message', async (event) => {
            if (event.origin !== window.location.origin) return;
            const message = event.data || {};

            if (message.type === 'hive-login-success') {
                if (message.sessionToken) {
                    localStorage.setItem('sessionToken', message.sessionToken);
                }

                try {
                    const authResponse = await hiveFetch(publicConfiguration.routePaths.AuthStatus || ClientPaths.AuthStatus);
                    const auth = authResponse.ok ? await authResponse.json() : { loggedIn: false, canViewDocumentation: false };

                    if (auth.loggedIn && auth.canViewDocumentation) {
                        window.location.reload();
                        return;
                    }
                }
                catch (e) {
                }

                loadServices();
                return;
            }

            if (message.type === 'hive-login-failed') {
                const status = document.getElementById('status');
                if (status) status.textContent = message.message || 'Invalid login credentials.';
            }
        });

        window.addEventListener("focus", () => {
            loadServices();
        });
    </script>
</body>
</html>
